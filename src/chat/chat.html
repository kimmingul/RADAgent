<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DelphiAgent Chat</title>
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="activity.css">
  <link rel="stylesheet" href="chrome.css">
  <link rel="stylesheet" href="btw.css">
</head>
<body>
  <div id="topbar">
    <button id="title-btn" class="icon-btn" title="세션 목록">새 대화</button>
    <span id="project-chip" class="chip" hidden></span>
    <span class="spacer"></span>
    <button id="btw-btn" class="icon-btn" title="곁가지 질문 메모 (/btw)">BTW<span id="btw-count"></span></button>
    <button id="new-btn" class="icon-btn" title="새 세션">＋</button>
    <button id="export-btn" class="icon-btn" title="HTML로 내보내기">⤓</button>
    <button id="settings-btn" class="icon-btn" title="설정">⚙</button>
  </div>
  <div id="banner" hidden></div>
  <div id="log"></div>
  <button id="scroll-bottom-btn" aria-label="새 메시지">↓ 새 메시지</button>
  <div id="btw-panel" hidden>
    <div class="btw-head">
      <span class="btw-title">곁가지 질문 메모</span>
      <span class="spacer"></span>
      <button id="btw-close" class="icon-btn" title="닫기 (Esc)">×</button>
    </div>
    <div class="btw-tools">
      <input id="btw-search" type="search" placeholder="질문·답 검색">
      <label><input id="btw-only" type="checkbox"> 이 대화만</label>
    </div>
    <div id="btw-list"></div>
    <div class="btw-new">
      <textarea id="btw-new-input" rows="2" placeholder="새 곁가지 질문 (Enter로 보내기) · 지금 대화 맥락으로 따로 답하고 대화에는 넣지 않습니다"></textarea>
    </div>
  </div>
  <div id="composer">
    <div class="composer-col">
      <div id="slash-menu" class="popup" hidden></div>
      <div id="plus-menu" class="popup" hidden>
        <div class="popup-item" data-action="attachFiles"><span class="menu-icon">📎</span><span class="popup-name">파일 또는 사진 추가</span></div>
        <div class="popup-item" data-action="addFolder"><span class="menu-icon">📁</span><span class="popup-name">폴더 추가</span></div>
        <div class="popup-sep"></div>
        <div class="popup-item has-sub" data-sub="connectors"><span class="menu-icon">⊞</span><span class="popup-name">커넥터</span><span class="sub-arrow">›</span></div>
        <div class="popup-item has-sub" data-sub="plugins"><span class="menu-icon">⧉</span><span class="popup-name">플러그인</span><span class="sub-arrow">›</span></div>
        <div class="popup-sep"></div>
        <div class="popup-item" data-action="compile"><span class="menu-icon">▶</span><span class="popup-name">프로젝트 컴파일</span></div>
      </div>
      <div id="sub-menu" class="popup" hidden></div>
      <div id="chips"></div>
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="메시지 입력 · / 입력 시 명령어"></textarea>
        <button id="send-btn" title="보내기 (Enter)" disabled>↑</button>
      </div>
      <div class="composer-footer">
        <button id="plus-btn" class="icon-btn" title="파일·폴더·커넥터·플러그인">＋</button>
        <select id="approval-select" title="승인 방식: omp 도구와 IDE 변경(버퍼·폼·디버거). 항상 묻기 = 변경마다, 쓰기 허용 = 턴마다 한 번, 권한 무시 = 묻지 않음 (저장은 하지 않음), 계획 = 바꾸지 않고 계획서만 docs\plans에 작성">
          <option value="always-ask">항상 묻기</option>
          <option value="write">쓰기 허용</option>
          <option value="yolo">권한 무시</option>
          <option value="plan">계획</option>
        </select>
        <span class="spacer"></span>
        <select id="model-select" title="모델"></select>
        <select id="thinking-select" title="생각 수준"></select>
        <svg id="ctx-ring" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="var(--border)" stroke-width="3"/><circle id="ctx-arc" cx="10" cy="10" r="8" fill="none" stroke="var(--muted)" stroke-width="3" stroke-dasharray="0 50.3" transform="rotate(-90 10 10)"/></svg>
        <span id="conn-dot" class="off" title="연결 중"></span>
      </div>
    </div>
  </div>
  <script src="markdown.js"></script>
  <script src="activity.js"></script>
  <script src="tools.js"></script>
  <script src="approval.js"></script>
  <script src="btw.js"></script>
  <script src="checkpoints.js"></script>
  <script src="topbar.js"></script>
  <script src="composer.js"></script>
  <script src="plusmenu.js"></script>
  <script src="chat.js"></script>
</body>
</html>
